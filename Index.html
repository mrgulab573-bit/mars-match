        // Generator for 50 Scaling Levels
        function generate50Levels() {
            const levels = [];
            for (let i = 1; i <= 50; i++) {
                // Moves scale down from 25 to 15
                const moves = Math.max(15, Math.floor(25 - (i - 1) * (10 / 49)));
                
                // Allowed tile variety
                let allowedCount = 4;
                if (i > 8) allowedCount = 5;
                if (i > 20) allowedCount = 6;
                const allowedTypes = TILE_TYPES.slice(0, allowedCount).map(t => t.id);

                // Target Goals
                const goals = {};
                const goalCount = i <= 5 ? 1 : (i <= 22 ? 2 : 3);
                
                for (let g = 0; g < goalCount; g++) {
                    const typeIdx = (i + g * 2) % allowedTypes.length;
                    const typeId = allowedTypes[typeIdx];
                    const targetAmount = Math.min(35, Math.floor(10 + (i * 0.45) + (g * 3)));
                    goals[typeId] = targetAmount;
                }

                levels.push({
                    level: i,
                    moves: moves,
                    goals: goals,
                    allowedTypes: allowedTypes
                });
            }
            return levels;

        function playSynthSound(type, combo = 0) {
            if (!soundEnabled) return;

                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.18);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);

                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'rocket') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);

                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'win') {
                    [440, 554, 659, 880].forEach((freq, idx) => {

                        o.connect(g);
